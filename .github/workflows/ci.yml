name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra crawl4ai --python 3.12
      - run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.browser-cache" uv run --extra crawl4ai playwright install --with-deps chromium
      - run: uv run --extra crawl4ai pytest -q
      - run: uv run --extra crawl4ai ruff check src tests
      - run: uv run --extra crawl4ai ruff format --check src tests
