<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic: field class renamed mid-listing</title></head>
<body>
<h1>Listing whose price class was renamed halfway</h1>
<!-- The site renamed span.price to span.cost partway down the page.  The
     identity and the name survive; only the price field must degrade to a
     warning, because one renamed class must not zero the page. -->
<article data-id="R1"><span class="name">Alpha</span><span class="price">10</span></article>
<article data-id="R2"><span class="name">Bravo</span><span class="price">20</span></article>
<article data-id="R3"><span class="name">Charlie</span><span class="cost">30</span></article>
<article data-id="R4"><span class="name">Delta</span><span class="cost">40</span></article>
</body>
</html>
