[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnicrawler-agent"
version = "0.1.0"
description = "Source-traceable data collection and change monitoring"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/references/document-design/*/LICENSE.txt"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.11,<4",
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "mcp>=1.10,<2",
    "playwright>=1.49,<2",
    "pydantic>=2.10,<3",
    "python-docx>=1.2,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
crawl4ai = [
    "crawl4ai>=0.7,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pypdf>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicrawler"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE", "/uv.lock", "/examples", "/docs/assets", "/docs/usage.md", "/docs/third-party-dependencies.md", "/docs/references/document-design", "/docs/report-design.md", "/.agents/skills/report-design", "/AGENTS.md"]

[project.scripts]
omnicrawler = "omnicrawler.cli:main"
